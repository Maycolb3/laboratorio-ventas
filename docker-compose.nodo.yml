# Un nodo del sistema distribuido. TODOS los computadores usan este mismo
# archivo; lo único que cambia es el .env de cada uno (ver .env.ejemplo).
# Cada computador corre un nodo de la base de datos y una réplica de cada
# servicio, así que si uno se apaga los demás siguen atendiendo.
# Uso: docker compose -f docker-compose.nodo.yml up -d --build
name: ventas-nodo

# NODOS = las IP de Tailscale de todos los computadores, separadas por coma
# (la misma línea en todos los .env). Si un .env viejo no la tiene, se arma
# con MI_IP, IP_OTRO_1 e IP_OTRO_2, como cuando eran tres.
# Cada servicio usa primero la réplica de su propio computador y, si no
# responde, las de los demás (comun/replicas.py arma la lista con NODOS).
x-entorno: &entorno
  NODO: ${NODO:?Falta NODO en el archivo .env (A, B, C, D o E)}
  MI_IP: ${MI_IP:?Falta MI_IP en el archivo .env}
  NODOS: ${NODOS:-${MI_IP},${IP_OTRO_1},${IP_OTRO_2}}

x-servicio: &servicio
  restart: unless-stopped
  depends_on: [rqlite]

services:
  rqlite:
    image: rqlite/rqlite:10.6.0
    container_name: bd
    # Todos los nodos votan: el líder confirma cada escritura cuando la guardó
    # la mayoría (2 de 3, 3 de 5). Un nodo nuevo se une solo al clúster que
    # ya existe y recibe una copia completa de los datos.
    # La primera vez que se crea el clúster, la base espera a tres nodos para
    # elegir el primer líder; los demás se unen después.
    # Tiempos de Raft para internet: entre computadores por Tailscale la ida y
    # vuelta puede pasar de 200 ms. Con el valor por defecto (1 s) los nodos se
    # pierden de vista por momentos y repiten la elección de líder sin parar.
    # -join se arma con NODOS: "ip1,ip2" -> "ip1:4002,ip2:4002".
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        UNIR=$$(echo "$$NODOS" | sed 's/ //g; s/,/:4002,/g; s/$$/:4002/');
        exec docker-entrypoint.sh -bootstrap-expect 3
        -raft-heartbeat-timeout 3s -raft-election-timeout 3s -join "$$UNIR"
    environment:
      NODOS: ${NODOS:-${MI_IP},${IP_OTRO_1},${IP_OTRO_2}}
      NODE_ID: nodo-${NODO}
      HTTP_ADV_ADDR: ${MI_IP}:4001   # dirección con la que lo encuentran los otros nodos
      RAFT_ADV_ADDR: ${MI_IP}:4002
    ports:
      - "4001:4001"   # consultas de los servicios
      - "4002:4002"   # replicación entre nodos (Raft)
    volumes:
      - datos:/rqlite/file   # los datos quedan en disco: sobreviven a reinicios
    restart: unless-stopped

  usuarios:
    <<: *servicio
    build: {context: ., dockerfile: usuarios/Dockerfile}
    container_name: servicio-usuarios
    ports: ["8001:8001"]
    environment: *entorno

  productos:
    <<: *servicio
    build: {context: ., dockerfile: productos/Dockerfile}
    container_name: servicio-productos
    ports: ["8002:8002"]
    environment: *entorno

  pedidos:
    <<: *servicio
    build: {context: ., dockerfile: pedidos/Dockerfile}
    container_name: servicio-pedidos
    ports: ["8000:8000"]
    environment: *entorno

  interfaz:
    <<: *servicio
    build: {context: ., dockerfile: interfaz/Dockerfile}
    container_name: servicio-interfaz
    ports: ["8080:8080"]
    environment:
      <<: *entorno
      ENTRADAS: ${ENTRADAS:-}
      # Un solo enlace público para todo el sistema (Cloudflare Tunnel, README
      # paso 11). Los tres computadores usan el MISMO token: Cloudflare envía
      # cada visita a un conector vivo. El conector corre dentro de este mismo
      # contenedor, así que si la interfaz se cae, su conector también.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  datos:
